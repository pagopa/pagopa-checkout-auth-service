name: OpenAPI Quality Check

# runs when the specs or the check itself change, on any base branch
on:
  pull_request:
    paths:
      - 'api-spec/**/*.yaml'
      - 'api-spec/**/*.yml'
      - '.github/workflows/open_api.yml'

permissions:
  contents: read

jobs:
  openapi_quality:
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.spec.version }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - path: 'api-spec/v1/openapi.yaml'
            version: 'v1'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # blocks on errors
      - name: Lint ${{ matrix.spec.path }}
        # note: extends the bundled ruleset via .spectral.yaml
        uses: pagopa/github-actions-template/openapi-lint@705d571bb13b279776fd20e9eb20232dc25679e4
        with:
          spec_path: ${{ matrix.spec.path }}
          ruleset: .spectral.yaml
          fail_severity: error
